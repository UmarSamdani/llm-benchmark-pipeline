AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LLM benchmark and pricing pipeline

Resources:

  RawDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ModelTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  SyncPricingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/sync_pricing/
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          BUCKET_NAME: !Ref RawDataBucket
          TABLE_NAME: !Ref ModelTable
      Policies:
        - S3WritePolicy:
            BucketName: !Ref RawDataBucket
        - DynamoDBWritePolicy:
            TableName: !Ref ModelTable
  

Outputs:
  BucketName:
    Value: !Ref RawDataBucket
  TableName:
    Value: !Ref ModelTable
  FunctionName:
    Value: !Ref SyncPricingFunction